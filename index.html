</style><style>#sync{cursor:pointer;text-decoration:underline dotted}#entry .lgs{display:flex;gap:12px}#entry .lgs img{width:72px;height:72px;border-radius:14px;object-fit:cover}#lgbox{width:min(340px,90vw);display:flex;flex-direction:column;gap:10px;align-items:stretch}#entry input{padding:12px;border:1px solid #c9c2b0;border-radius:10px;font:16px system-ui,sans-serif;text-align:center;background:#fff;color:#1d2330;width:100%;box-sizing:border-box}#entry button.lb{width:100%;min-height:0;padding:12px;border-radius:10px;background:#0a1626;color:#c9a35a;font:600 16px system-ui,sans-serif;box-shadow:none;display:block}#entry button.lb:disabled{opacity:.6}#entry .lgm{min-height:18px;font-size:14px}#entry a{color:#0a1626}[data-act=vw]{display:none!important}#rfbar{margin-bottom:8px}</style></head><body><div id="entry"><div class="lgs"><img id="lgt" alt=""><img id="lgl" alt=""></div><h1 style="font:600 24px Georgia,serif;margin:0">Controller do escritório</h1><div id="lgbox"></div></div><header id="hd"></header><nav id="nav"></nav><main id="app"></main><div id="modal"><div class="box" id="mbox"></div></div><div id="lock" style="position:fixed;inset:0;z-index:50;background:#0a1626;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;color:#f1e6c8;padding:20px;text-align:center"><img class="lg" width="120" height="120" alt="" style="border-radius:16px"><div id="lk">Carregando…</div></div><script>
try{if('serviceWorker' in navigator&&/^https?:$/.test(location.protocol))navigator.serviceWorker.register('sw.js').catch(()=>{})}catch(e){}
const GD_URL='';
try{navigator.storage&&navigator.storage.persist&&navigator.storage.persist()}catch(e){}
const GDK=['gd-sess','gd-url'];
const gdIdb=()=>new Promise((res,rej)=>{const r=indexedDB.open('ctl-auth',1);r.onupgradeneeded=()=>r.result.createObjectStore('k');r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)});
const gdIdbSet=async(k,v)=>{try{const d=await gdIdb();d.transaction('k','readwrite').objectStore('k').put(v,k)}catch(e){}};
const gdIdbDel=async k=>{try{const d=await gdIdb();d.transaction('k','readwrite').objectStore('k').delete(k)}catch(e){}};
const gdIdbGet=async k=>{try{const d=await gdIdb();return await new Promise(r=>{const q=d.transaction('k').objectStore('k').get(k);q.onsuccess=()=>r(q.result||null);q.onerror=()=>r(null)})}catch(e){return null}};
try{const _si=Storage.prototype.setItem,_ri=Storage.prototype.removeItem;
Storage.prototype.setItem=function(k,v){if(this===window.localStorage&&GDK.includes(k))gdIdbSet(k,v);return _si.apply(this,arguments)};
Storage.prototype.removeItem=function(k){if(this===window.localStorage&&GDK.includes(k))gdIdbDel(k);return _ri.apply(this,arguments)}}catch(e){}
const gdRestore=async()=>{try{for(const k of GDK){if(!localStorage.getItem(k)){const v=await gdIdbGet(k);if(v)localStorage.setItem(k,v)}else{gdIdbSet(k,localStorage.getItem(k))}}}catch(e){}};
try{const m=/^#u=(.+)$/.exec(location.hash);if(m){localStorage.setItem('gd-url',decodeURIComponent(m[1]));history.replaceState(null,'',location.pathname+location.search)}}catch(e){}
const gdUrl=()=>{try{return GD_URL||localStorage.getItem('gd-url')||''}catch(e){return GD_URL}};
const gdSess=()=>{try{return JSON.parse(localStorage.getItem('gd-sess')||'null')}catch(e){return null}};
const gdRaw=async(u,body)=>{const ac=new AbortController(),to=setTimeout(()=>ac.abort(),40000);try{const r=await fetch(u,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify(body),signal:ac.signal});const tx=await r.text();let j;try{j=JSON.parse(tx)}catch(_){throw new Error('resposta inválida do servidor. Confira a implantação (acesso "Qualquer pessoa") e o URL')}if(!j.ok){const e=new Error(j.err||'erro');e.auth=!!j.auth;throw e}return j}catch(e){throw e.name=='AbortError'?new Error('tempo esgotado'):e}finally{clearTimeout(to)}};
const gdCall=(op,pl)=>{const s=gdSess();if(!s)return Promise.reject(Object.assign(new Error('sem sessão'),{auth:true}));return gdRaw(gdUrl(),Object.assign({t:s.t,op:op},pl))};
const gdTo=m=>{const e=document.getElementById('toast');if(!e)return;e.textContent=m;e.classList.add('on');setTimeout(()=>e.classList.remove('on'),3500)};
const gdModal=h=>{document.getElementById('mbox').innerHTML=h;document.getElementById('modal').style.display='flex'};
const gdCopy=async(t,b)=>{try{await navigator.clipboard.writeText(t)}catch(e){const x=document.createElement('textarea');x.value=t;x.style.cssText='position:fixed;opacity:0';document.body.appendChild(x);x.select();try{document.execCommand('copy')}catch(_){}x.remove()}if(b){const o=b.textContent;b.textContent='✔ Copiado';setTimeout(()=>b.textContent=o,1500)}};
const gdExpired=()=>{try{localStorage.removeItem('gd-sess')}catch(e){}alert('Sua sessão expirou. Entre novamente com o e-mail.');location.reload()};
async function gdOut(){if(!confirm('Sair deste aparelho? Será preciso um novo código para entrar. Alterações ainda não sincronizadas neste aparelho serão perdidas.'))return;try{await gdCall('out',{})}catch(e){}try{['gd-sess','gd-last-t','gd-last-l','ctl-t','ctl-l','tr-ok'].forEach(k=>localStorage.removeItem(k))}catch(e){}location.reload()}
const gdDev=()=>(/iPhone|iPad/.test(navigator.userAgent)?'iPhone/iPad':/Mac/.test(navigator.userAgent)?'Mac':'outro')+' '+new Date().toISOString().slice(0,10);
const gdNet=e=>/Failed to fetch|Load failed|NetworkError|network/i.test(e.message||'')?(navigator.onLine===false?'Sem conexão. O primeiro acesso de cada aparelho precisa de internet.':'Não consegui falar com o servidor do Google. Confira se a implantação do script está com acesso "Qualquer pessoa" e se o URL é o da implantação mais recente.'):(e.message||'Erro');
function loginUI(){
const b=document.getElementById('lgbox'),u=gdUrl(),$i=i=>document.getElementById(i),m=(t,ok)=>{const e=$i('lgm');if(e){e.textContent=t||'';e.style.color=ok?'#2a7a3b':'#b3261e'}};
if(!u){b.innerHTML='<p class="mut">Configuração inicial (uma vez): conecte o sistema ao Google Drive.</p><ol class="mut" style="text-align:left;padding-left:18px;margin:4px 0"><li>Entre em <b>script.google.com</b> com a conta <b>âncora (Thailsson)</b> e crie um <b>Novo projeto</b>.</li><li>Apague o que houver, cole o conteúdo do arquivo <b>apps-script-drive.gs</b> e salve.</li><li><b>Implantar → Nova implantação → App da Web</b>: Executar como <b>Eu</b>; Quem pode acessar <b>Qualquer pessoa</b>. Autorize (inclui o envio dos e-mails de código).</li><li>Cole abaixo o <b>URL</b> (termina em /exec).</li></ol><input id="lgu" placeholder="URL do app da Web (…/exec)"><button class="lb" id="lgsave">Salvar</button><div id="lgm" class="lgm"></div><p class="mut" style="font-size:12px">Para os outros aparelhos não precisarem disto, coloque o URL na linha <b>const GD_URL=\'\'</b> do index.html.</p>';
$i('lgsave').onclick=()=>{const v=$i('lgu').value.trim();if(!/^https:\/\/script\.google\.com\/.+\/exec/.test(v))return m('Cole o URL completo (termina em /exec).');try{localStorage.setItem('gd-url',v)}catch(e){}loginUI()};return}
b.innerHTML='<p class="mut">Acesso restrito. Informe seu e-mail para receber um código de confirmação. Isso só é pedido no primeiro acesso de cada aparelho.</p><input id="lge" type="email" inputmode="email" autocomplete="email" autocapitalize="off" placeholder="seu e-mail"><button class="lb" id="lgs">Enviar código</button><div id="lgm" class="lgm"></div>';
const step2=em=>{b.innerHTML='<p class="mut">Se o e-mail for autorizado, enviamos um código de 6 dígitos para <b id="lgem"></b>. Vale por 10 minutos; confira também o spam.</p><input id="lgc" inputmode="numeric" autocomplete="one-time-code" maxlength="6" placeholder="código de 6 dígitos"><button class="lb" id="lgv">Entrar</button><div id="lgm" class="lgm"></div><p class="mut"><a href="#" id="lgr">Reenviar código</a> · <a href="#" id="lgb">Trocar e-mail</a></p>';$i('lgem').textContent=em;
